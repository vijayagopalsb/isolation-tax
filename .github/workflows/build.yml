name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  demo-app:
    name: demo-app (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: demo-app
        run: mvn -B verify

  demo-archunit:
    name: demo-archunit (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        working-directory: demo-archunit
        run: mvn -B verify