name: CI — Lateral Isolation Enforcement

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  demo-app:
    name: demo-app (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: demo-app
        run: mvn -B verify

  demo-archunit:
    name: demo-archunit (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        working-directory: demo-archunit
        run: mvn -B verify

  demo-facade-vs-isolation:
    name: demo-facade-vs-isolation (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        working-directory: demo-facade-vs-isolation
        run: mvn -B verify

  # ============================================================
  # demo-microservices — The Lateral Isolation Proof
  # ============================================================
  demo-microservices:
    name: demo-microservices (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Build and install all modules defined in parent pom.xml
      - name: Build all modules
        run: mvn -B clean install

      # Run ArchUnit enforcement tests
      - name: Run ArchUnit enforcement tests
        run: mvn -B test -pl archunit-tests

      # Optional: Build Docker images
      - name: Build Docker images
        run: docker-compose build



